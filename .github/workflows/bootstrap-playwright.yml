name: Bootstrap Playwright
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-playwright.yml']
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @playwright/test@1.63.0 --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Playwright dependency already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(test): pin Playwright 1.63.0"
          git push origin HEAD:main
