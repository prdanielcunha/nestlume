name: NestLume Firebase Production Deploy

on:
  push:
    branches: [production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestlume-firebase-production
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  SITE_ID: nestlume-555464791734
  CUSTOM_DOMAIN: nestlume.millionsnest.com
  AI_ENDPOINT: https://nestlume-ai.pastordanielpcunha.workers.dev
  WRANGLER_VERSION: 4.144.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache pinned STEPBible snapshot
        uses: actions/cache@v4
        with:
          path: .cache/stepbible
          key: stepbible-v2-${{ runner.os }}-b99716b0cddb648ddb95cc786a197180f2f97d48

      - name: Cache pinned OpenBible mirror
        uses: actions/cache@v4
        with:
          path: .cache/openbible
          key: openbible-crossrefs-${{ runner.os }}-301fed486c8842c60dc95e930ec4d4c7bee0e101

      - name: Cache pinned OpenBible geography
        uses: actions/cache@v4
        with:
          path: .cache/openbible-geo
          key: openbible-geo-${{ runner.os }}-b127b4446c6f4ba36ec62dde290c752afeb51bf3

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run licenses:check
      - run: npm run build
      - run: npx playwright test --list
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke — desktop and mobile
        run: npm run e2e
      - name: Validate AI release sources
        run: |
          node --check workers/ai/index.js
          node --check scripts/ai-battery-cases.mjs
          node --check scripts/run-ai-battery.mjs
      - name: Reject secret-like committed files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*service[-_]?account.*\.json$|.*private[-_]?key.*)' | grep -v '\.env\.example$'; then
            echo 'Potential secret-bearing file committed.' >&2
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NESTLUME_TURNSTILE_SECRET: ${{ secrets.NESTLUME_TURNSTILE_SECRET }}
      VITE_NESTLUME_TURNSTILE_SITE_KEY: ${{ secrets.NESTLUME_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout exact verified production SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Authenticate with existing MillionsNest WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache pinned STEPBible snapshot
        uses: actions/cache@v4
        with:
          path: .cache/stepbible
          key: stepbible-v2-${{ runner.os }}-b99716b0cddb648ddb95cc786a197180f2f97d48

      - name: Cache pinned OpenBible mirror
        uses: actions/cache@v4
        with:
          path: .cache/openbible
          key: openbible-crossrefs-${{ runner.os }}-301fed486c8842c60dc95e930ec4d4c7bee0e101

      - name: Cache pinned OpenBible geography
        uses: actions/cache@v4
        with:
          path: .cache/openbible-geo
          key: openbible-geo-${{ runner.os }}-b127b4446c6f4ba36ec62dde290c752afeb51bf3

      - name: Install exact app dependencies and deployment CLIs
        run: |
          npm ci --no-audit --no-fund
          npm install --global firebase-tools@15.26.0
          npm install --global "wrangler@$WRANGLER_VERSION"
          wrangler --version

      - name: Require Cloudflare and Turnstile configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NESTLUME_TURNSTILE_SECRET VITE_NESTLUME_TURNSTILE_SITE_KEY; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Generate ephemeral AI validation credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "NESTLUME_CI_VALIDATION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build one-release Worker config with CI credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('workers/ai/wrangler.jsonc', 'utf8'));
          source.vars = { ...(source.vars || {}), CI_VALIDATION_TOKEN: process.env.NESTLUME_CI_VALIDATION_TOKEN };
          fs.writeFileSync('workers/ai/wrangler.release.jsonc', JSON.stringify(source, null, 2) + '\n');
          NODE

      - name: Publish protected NestLume AI Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NESTLUME_TURNSTILE_SECRET" | wrangler secret put TURNSTILE_SECRET --config workers/ai/wrangler.jsonc
          wrangler deploy --config workers/ai/wrangler.release.jsonc

      - name: Smoke protected AI Worker health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --silent --show-error --retry 6 --retry-delay 2 "$AI_ENDPOINT/health" > artifacts/ai-health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('artifacts/ai-health.json', 'utf8'));
          if (!health.ok || health.provider !== 'cloudflare-workers-ai' || health.model !== '@cf/google/gemma-4-26b-a4b-it') process.exit(1);
          NODE

      - name: Verify protected CI validation route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ready=false
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output artifacts/ai-ci-auth-probe.json --write-out '%{http_code}' \
              --request POST \
              -H 'content-type: application/json' \
              -H 'origin: https://nestlume.millionsnest.com' \
              -H "x-nestlume-ci-token: $NESTLUME_CI_VALIDATION_TOKEN" \
              --data '{}' \
              "$AI_ENDPOINT/v1/ci-study" || true)"
            if [ "$status" = "400" ]; then
              node --input-type=module -e "import fs from 'node:fs'; const body=JSON.parse(fs.readFileSync('artifacts/ai-ci-auth-probe.json','utf8')); if(body.error!=='invalid_request') process.exit(1);"
              ready=true
              break
            fi
            echo "CI validation version not active yet (HTTP $status, attempt $attempt/12)."
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Protected CI validation route did not activate." >&2
            cat artifacts/ai-ci-auth-probe.json || true
            exit 1
          fi

      - name: Prepare corpus for live AI battery
        run: npm run corpus:build

      - name: Run real Workers AI Portuguese battery
        id: live_ai_battery
        continue-on-error: true
        env:
          NESTLUME_AI_ENDPOINT: ${{ env.AI_ENDPOINT }}
          NESTLUME_AI_PATH: /v1/ci-study
          NESTLUME_AI_BATTERY_OUTPUT: artifacts/ai-battery-result.json
        run: npm run ai:battery

      - name: Remove CI validation credential from live Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config workers/ai/wrangler.jsonc
          printf '%s' "$NESTLUME_TURNSTILE_SECRET" | wrangler secret put TURNSTILE_SECRET --config workers/ai/wrangler.jsonc

      - name: Upload live AI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestlume-live-ai-${{ env.RELEASE_SHA }}
          path: |
            artifacts/ai-health.json
            artifacts/ai-ci-auth-probe.json
            artifacts/ai-battery-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce live AI battery gate
        if: steps.live_ai_battery.outcome != 'success'
        run: |
          echo "Live Workers AI battery failed; Firebase frontend will not be enabled for AI." >&2
          exit 1

      - name: Build exact release with live AI configuration
        env:
          VITE_NESTLUME_AI_ENDPOINT: ${{ env.AI_ENDPOINT }}
          VITE_NESTLUME_TURNSTILE_SITE_KEY: ${{ secrets.NESTLUME_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Verify live AI configuration is present in built frontend
        shell: bash
        env:
          VITE_NESTLUME_TURNSTILE_SITE_KEY: ${{ secrets.NESTLUME_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          grep -R -F "$AI_ENDPOINT" dist >/dev/null
          grep -R -F "$VITE_NESTLUME_TURNSTILE_SITE_KEY" dist >/dev/null
          echo "AI_FRONTEND_WIRING=verified"

      - name: Ensure isolated NestLume Hosting site exists
        shell: bash
        run: |
          set -euo pipefail
          if firebase hosting:sites:get "$SITE_ID" --project "$PROJECT_ID" >/tmp/nestlume-site.json 2>/tmp/nestlume-site.err; then
            echo "SITE_EXISTS=true"
          else
            echo "Site does not exist yet; creating isolated NestLume Hosting site."
            cat /tmp/nestlume-site.err || true
            firebase hosting:sites:create "$SITE_ID" --project "$PROJECT_ID" --non-interactive
          fi
          firebase hosting:sites:get "$SITE_ID" --project "$PROJECT_ID"

      - name: Deploy only NestLume Hosting target
        run: firebase deploy --only hosting:nestlume --project "$PROJECT_ID" --non-interactive

      - name: Smoke Firebase default URL
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://$SITE_ID.web.app"
          for path in "/" "/ler/jhn/1?v=1" "/explorar" "/colar"; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 "$BASE_URL$path" >/tmp/nestlume-smoke.html
            grep -q "NestLume" /tmp/nestlume-smoke.html
          done
          echo "FIREBASE_DEFAULT_URL=$BASE_URL"
          echo "FIREBASE_SMOKE=success"

      - name: Ensure Firebase custom-domain resource exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TOKEN="$(gcloud auth print-access-token)"
          DOMAIN_URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE_ID/customDomains/$CUSTOM_DOMAIN"
          HTTP_CODE="$(curl --silent --show-error --output artifacts/custom-domain-before.json --write-out '%{http_code}'             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             "$DOMAIN_URL")"

          if [ "$HTTP_CODE" = "404" ]; then
            CREATE_URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE_ID/customDomains?customDomainId=$CUSTOM_DOMAIN"
            CREATE_CODE="$(curl --silent --show-error --output artifacts/custom-domain-create-operation.json --write-out '%{http_code}'               --request POST               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               --data '{}'               "$CREATE_URL")"
            if [ "$CREATE_CODE" -lt 200 ] || [ "$CREATE_CODE" -ge 300 ]; then
              cat artifacts/custom-domain-create-operation.json
              exit 1
            fi
            sleep 8
          elif [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            cat artifacts/custom-domain-before.json
            exit 1
          fi

          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             "$DOMAIN_URL" > artifacts/firebase-custom-domain.json

          jq '{
            name,
            hostState,
            ownershipState,
            reconciling,
            cert: (.cert // null),
            issues: (.issues // []),
            requiredDnsUpdates: (.requiredDnsUpdates // null)
          }' artifacts/firebase-custom-domain.json | tee artifacts/firebase-domain-status.json

          jq -n             --arg sha "$RELEASE_SHA"             --arg project "$PROJECT_ID"             --arg site "$SITE_ID"             --arg defaultUrl "https://$SITE_ID.web.app"             --arg customDomain "$CUSTOM_DOMAIN"             '{releaseSha:$sha,projectId:$project,siteId:$site,defaultUrl:$defaultUrl,customDomain:$customDomain}'             > artifacts/firebase-release.json

      - name: Apply only Firebase-requested DNS records when Cloudflare credentials already exist
        shell: bash
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: millionsnest.com
          FIREBASE_CUSTOM_DOMAIN_JSON: artifacts/firebase-custom-domain.json
        run: |
          set -o pipefail
          node scripts/upsert-cloudflare-dns.mjs | tee artifacts/cloudflare-dns.log

      - name: Re-read Firebase domain state after optional DNS update
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          TOKEN="$(gcloud auth print-access-token)"
          DOMAIN_URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE_ID/customDomains/$CUSTOM_DOMAIN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$DOMAIN_URL" > artifacts/firebase-custom-domain-after-dns.json
          jq '{
            name,
            hostState,
            ownershipState,
            reconciling,
            cert: (.cert // null),
            issues: (.issues // []),
            requiredDnsUpdates: (.requiredDnsUpdates // null)
          }' artifacts/firebase-custom-domain-after-dns.json | tee artifacts/firebase-domain-after-dns-status.json

      - name: Probe official custom domain without hiding DNS/certificate state
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://$CUSTOM_DOMAIN/" \
            | grep -q "NestLume" \
            && echo "CUSTOM_DOMAIN_SMOKE=success" \
            || echo "CUSTOM_DOMAIN_SMOKE=pending"

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: nestlume-firebase-release-${{ env.RELEASE_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
