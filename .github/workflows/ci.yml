name: NestLume CI
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nestlume-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Promote lockfile to feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin npm dependency tree"
            git push origin "HEAD:$HEAD_REF"
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reject secret-like committed files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*service[-_]?account.*\.json$|.*private[-_]?key.*)' | grep -v '\.env\.example$'; then
            echo 'Potential secret-bearing file committed.' >&2
            exit 1
          fi
