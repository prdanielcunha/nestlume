name: NestLume CI
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache pinned STEPBible snapshot
        uses: actions/cache@v4
        with:
          path: .cache/stepbible
          key: stepbible-${{ runner.os }}-b99716b0cddb648ddb95cc786a197180f2f97d48
      - name: Cache pinned OpenBible mirror
        uses: actions/cache@v4
        with:
          path: .cache/openbible
          key: openbible-crossrefs-${{ runner.os }}-301fed486c8842c60dc95e930ec4d4c7bee0e101
      - name: Cache pinned OpenBible geography
        uses: actions/cache@v4
        with:
          path: .cache/openbible-geo
          key: openbible-geo-${{ runner.os }}-b127b4446c6f4ba36ec62dde290c752afeb51bf3
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Audit dependency licenses
        run: npm run licenses:check
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke — desktop and mobile
        run: npm run e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nestlume-playwright-failures
          path: |
            artifacts/playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Check AI Worker syntax
        run: node --check workers/ai/index.js
      - name: Check AI battery syntax
        run: |
          node --check scripts/ai-battery-cases.mjs
          node --check scripts/run-ai-battery.mjs
      - name: Reject secret-like committed files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*service[-_]?account.*\.json$|.*private[-_]?key.*)' | grep -v '\.env\.example$'; then
            echo 'Potential secret-bearing file committed.' >&2
            exit 1
          fi
