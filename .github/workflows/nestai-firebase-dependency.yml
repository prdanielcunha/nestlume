name: Install Firebase App Check
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/nestai-firebase-dependency.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Firebase runtime
        run: npm install --save-exact firebase@12.6.0 --no-audit --no-fund
      - name: Verify Firebase SDK
        run: node -e "const p=require('./package.json'); if(!p.dependencies?.firebase) process.exit(1); console.log('FIREBASE_APP_CHECK_DEPENDENCY_READY')"
      - name: Commit dependency and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "nestai: install Firebase App Check client"
          git push
